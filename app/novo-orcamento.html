<!-- MAIN -->
<div class="main">
  <header class="topbar">
    <div class="flex-center gap-8">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title" id="topbarTitle">Novo Orçamento</span>
    </div>
    <div class="topbar-actions">
      <div class="user-info">
        <div class="avatar" id="avatar">M</div>
        <span id="userName"></span>
      </div>
    </div>
  </header>

  <div class="page-content">

    <!-- Dados principais -->
    <div class="form-section">
      <div class="form-section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Dados do Orçamento
      </div>
      <div class="form-row cols-3">
        <div class="form-group">
          <label>Número</label>
          <input type="text" id="numero" readonly style="background:#f5f5f5;cursor:not-allowed;">
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data">
        </div>
        <div class="form-group">
          <label>Validade</label>
          <input type="date" id="validade">
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Cliente / Obra</label>
          <input type="text" id="cliente" placeholder="Nome do cliente ou identificação da obra">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="em-aberto">Em aberto</option>
            <option value="aprovado">Aprovado</option>
            <option value="em-producao">Em produção</option>
            <option value="entregue">Entregue</option>
            <option value="recusado">Recusado</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Ambientes -->
    <div class="form-section">
      <div class="form-section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Ambientes e Itens
      </div>

      <div id="ambientesContainer"></div>

      <button type="button" class="btn btn-outline mt-8" onclick="adicionarAmbiente()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Ambiente
      </button>
    </div>

    <!-- Material e valor -->
    <div class="form-section">
      <div class="form-section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Material e Valor
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Material Principal Utilizado</label>
          <input type="text" id="material" list="dlMateriais" placeholder="Ex: Mármore Champagne, Granito Preto São Gabriel...">
        </div>
        <div class="form-group">
          <label>Valor Total (R$)</label>
          <input type="number" id="valorTotal" placeholder="0,00" step="0.01" min="0">
        </div>
      </div>
    </div>

    <!-- Botões de ação -->
    <div class="flex-center gap-12" style="flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="salvar()">

        Salvar
      </button>
      <button class="btn btn-success" onclick="salvarEGerarPDF()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Gerar PDF

      <button class="btn btn-whats" onclick="salvarEEnviarWhats()">

        WhatsApp

      <a href="orcamentos.html" class="btn btn-ghost">Cancelar</a>

<script src="js/core.js"></script>
<script src="js/pdf.js"></script>
<script>
// Preencher datalist de itens do catálogo
function preencherDlItens() {
  const dl   = document.getElementById('dlItens');
  const cats = getCatalogo();
  dl.innerHTML = cats.map(c => `<option value="${c.nome}">`).join('');
}

// ─── Ambientes ───────────────────────────────
let ambienteCount = 0;

function adicionarAmbiente(dadosAmbiente) {
  ambienteCount++;
  const id   = 'amb_' + ambienteCount;
  const nome = dadosAmbiente ? dadosAmbiente.nome : `Ambiente ${ambienteCount}`;
  const div  = document.createElement('div');
  div.className = 'ambiente-block';
  div.id        = id;
  div.innerHTML = `
    <div class="ambiente-header">
      <input type="text" value="${escaparAttr(nome)}" placeholder="Nome do ambiente (ex: Suíte 1, Cozinha...)" class="amb-nome">
      <button type="button" class="btn btn-danger btn-sm" onclick="removerAmbiente('${id}')">&#x2715; Remover</button>
    </div>
    <div class="ambiente-body">
      <div class="item-labels">
        <span>Descrição</span>
        <span>Dimensões</span>
        <span>Quantidade</span>
        <span>Observação</span>
        <span></span>
      </div>
      <div class="itens-container"></div>
    </div>
    <div class="ambiente-footer">
      <button type="button" class="btn btn-ghost btn-sm" onclick="adicionarItem('${id}')">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar item
      </button>
    </div>
  `;
  document.getElementById('ambientesContainer').appendChild(div);

  // Preencher itens existentes
  if (dadosAmbiente && dadosAmbiente.itens) {
    dadosAmbiente.itens.forEach(item => adicionarItem(id, item));
  } else {
    adicionarItem(id);
  }
}

function removerAmbiente(id) {
  document.getElementById(id).remove();
}

function adicionarItem(ambId, dadosItem) {
  const cont  = document.querySelector(`#${ambId} .itens-container`);
  const itemId = 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const row    = document.createElement('div');
  row.className = 'item-row';
  row.id        = itemId;
  row.innerHTML = `
    <input type="text" list="dlItens" placeholder="Descrição do item" class="item-desc" value="${escaparAttr(dadosItem?.descricao||'')}">
    <input type="text" placeholder="Dimensões" class="item-dim" value="${escaparAttr(dadosItem?.dimensoes||'')}">
    <input type="text" placeholder="Qtd / Unidade" class="item-qtd" value="${escaparAttr(dadosItem?.quantidade||'')}">
    <input type="text" placeholder="Observação" class="item-obs" value="${escaparAttr(dadosItem?.observacao||'')}">
    <button type="button" class="btn-remove-item" title="Remover item" onclick="document.getElementById('${itemId}').remove()">&#x2715;</button>
  `;
  cont.appendChild(row);
}

function escaparAttr(str) {
  return String(str||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Coletar dados do form ───────────────────
function coletarOrcamento() {
  const ambientes = [];
  document.querySelectorAll('.ambiente-block').forEach(amb => {
    const nomeAmb = amb.querySelector('.amb-nome').value.trim();
    const itens   = [];
    amb.querySelectorAll('.item-row').forEach(row => {
      const desc = row.querySelector('.item-desc').value.trim();
      const dim  = row.querySelector('.item-dim').value.trim();
      const qtd  = row.querySelector('.item-qtd').value.trim();
      const obs  = row.querySelector('.item-obs').value.trim();
      if (desc || dim || qtd) itens.push({ descricao: desc, dimensoes: dim, quantidade: qtd, observacao: obs });
    });
    if (nomeAmb || itens.length) ambientes.push({ nome: nomeAmb, itens });
  });

  return {
    numero:     document.getElementById('numero').value,
    data:       document.getElementById('data').value,
    validade:   document.getElementById('validade').value,
    cliente:    document.getElementById('cliente').value.trim(),
    status:     document.getElementById('status').value,
    material:   document.getElementById('material').value.trim(),
    valorTotal: parseFloat(document.getElementById('valorTotal').value) || 0,
    ambientes,
  };
}

// ─── Salvar ──────────────────────────────────
let orcId = null;

function salvar(silent) {
  const dados = coletarOrcamento();
  if (!dados.cliente) { toast('Informe o cliente/obra.', 'error'); return null; }
  const orc = Object.assign({ id: orcId || gerarId() }, dados);
  orcId = orc.id;
  saveOrcamento(orc);
  if (!silent) toast('Orçamento salvo!');
  // Atualizar URL sem recarregar
  if (history.replaceState) history.replaceState({}, '', '?id=' + orcId);
  return orc;
}

function salvarEGerarPDF() {
  const orc = salvar(true);
  if (orc) gerarPDF(orc);
}

function salvarEEnviarWhats() {
  const orc = salvar(true);
  if (!orc) return;
  const emp = getEmpresa();
  const msg = (emp.msgWhats || 'Olá {{cliente}}, segue o orçamento Nº {{numero}} no valor de R$ {{valor}}.')
    .replace('{{cliente}}', orc.cliente)
    .replace('{{numero}}',  orc.numero)
    .replace('{{valor}}',   formatBRL(orc.valorTotal));
  const num = (emp.whatsapp || '').replace(/\D/g,'');
  const url = num ? `https://wa.me/55${num}?text=${encodeURIComponent(msg)}`
                  : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// ─── Init ────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  preencherDlItens();

  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');

  if (editId) {
    // Modo edição
    const orc = getOrcamento(editId);
    if (orc) {
      orcId = orc.id;
      document.getElementById('topbarTitle').textContent = 'Editar Orçamento';
      document.getElementById('numero').value     = orc.numero     || '';
      document.getElementById('data').value       = orc.data       || hoje();
      document.getElementById('validade').value   = orc.validade   || dataValidade(15);
      document.getElementById('cliente').value    = orc.cliente    || '';
      document.getElementById('status').value     = orc.status     || 'em-aberto';
      document.getElementById('material').value   = orc.material   || '';
      document.getElementById('valorTotal').value = orc.valorTotal || '';
      (orc.ambientes || []).forEach(amb => adicionarAmbiente(amb));
    }
  } else {
    // Novo orçamento
    document.getElementById('numero').value   = proximoNumero();
    document.getElementById('data').value     = hoje();
    document.getElementById('validade').value = dataValidade(15);
    adicionarAmbiente();
  }
});
</script>
