<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — OrçaMármore</title>
<style>
  :root {
    --verde-escuro: #1B5E20;
    --verde-medio:  #2E7D32;
    --verde-claro:  #E8F5E9;
    --verde-dest:   #4CAF50;
    --fundo:        #F1F8E9;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fundo);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 440px;
  }
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand-logo {
    width: 60px;
    height: 60px;
    background: var(--verde-escuro);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .brand-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--verde-escuro);
    letter-spacing: 0.5px;
  }
  .brand-sub {
    font-size: 13px;
    color: #78909C;
    margin-top: 4px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    overflow: hidden;
  }
  .tabs {
    display: flex;
    border-bottom: 2px solid #ECEFF1;
  }
  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #90A4AE;
    cursor: pointer;
    background: none;
    border: none;
    font-family: Arial, Helvetica, sans-serif;
    transition: color 0.2s;
  }
  .tab.active {
    color: var(--verde-escuro);
    border-bottom: 3px solid var(--verde-dest);
    margin-bottom: -2px;
  }
  .tab-content { display: none; padding: 28px; }
  .tab-content.active { display: block; }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #546E7A;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid #CFD8DC;
    border-radius: 7px;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    color: #37474F;
    transition: border-color 0.2s;
  }
  input:focus {
    outline: none;
    border-color: var(--verde-dest);
    box-shadow: 0 0 0 3px rgba(76,175,80,0.12);
  }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--verde-escuro);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--verde-medio); }
  .msg-error {
    background: #FFEBEE;
    color: #C62828;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .msg-ok {
    background: var(--verde-claro);
    color: var(--verde-escuro);
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .divider {
    height: 3px;
    background: var(--verde-dest);
    border-radius: 2px;
    margin: 0;
  }
  .back-link {
    text-align: center;
    margin-top: 20px;
  }
  .back-link a {
    color: #78909C;
    font-size: 13px;
    text-decoration: none;
  }
  .back-link a:hover { color: var(--verde-escuro); }
</style>
</head>
<body>

<div class="container">

  <div class="brand">
    <div class="brand-logo">
      <svg width="34" height="34" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </div>
    <div class="brand-name">OrçaMármore</div>
    <div class="brand-sub">Orçamentos profissionais para marmorarias</div>
  </div>

  <div class="card">
    <div class="divider"></div>
    <div class="tabs">
      <button class="tab active" onclick="trocarTab('entrar')">Entrar</button>
      <button class="tab" onclick="trocarTab('cadastrar')">Criar Conta</button>
    </div>

    <!-- LOGIN -->
    <div class="tab-content active" id="tabEntrar">
      <div class="msg-error" id="loginErro"></div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seuemail@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
      <p style="text-align:center;font-size:12px;color:#90A4AE;margin-top:16px;">
        Não tem conta? <a href="#" onclick="trocarTab('cadastrar');return false;" style="color:#1B5E20;font-weight:700;">Criar conta grátis</a>
      </p>
    </div>

    <!-- CADASTRO -->
    <div class="tab-content" id="tabCadastrar">
      <div class="msg-error" id="cadErro"></div>
      <div class="msg-ok" id="cadOk"></div>
      <div class="form-group">
        <label>Seu nome</label>
        <input type="text" id="cadNome" placeholder="João Silva" autocomplete="name">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="cadEmail" placeholder="seuemail@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Nome da Marmoraria</label>
        <input type="text" id="cadMarmoraria" placeholder="Ex: Marmoraria Diamante">
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="text" id="cadTelefone" placeholder="(00) 00000-0000">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <button class="btn-primary" onclick="fazerCadastro()">Criar conta grátis</button>
      <p style="text-align:center;font-size:12px;color:#90A4AE;margin-top:16px;">
        Ao criar conta, você concorda com os termos de uso.
      </p>
    </div>
  </div>

  <div class="back-link">
    <a href="index.html">&#8592; Voltar para o site</a>
  </div>

</div>

<script src="app/js/core.js"></script>
<script>
// Verificar se já está logado
document.addEventListener('DOMContentLoaded', () => {
  if (getUsuario()) window.location.href = 'app/dashboard.html';
});

function trocarTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const isTarget = (i === 0 && tab === 'entrar') || (i === 1 && tab === 'cadastrar');
    t.classList.toggle('active', isTarget);
  });
  document.getElementById('tabEntrar').classList.toggle('active', tab === 'entrar');
  document.getElementById('tabCadastrar').classList.toggle('active', tab === 'cadastrar');
}

function mostrarErro(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

function esconderErro(id) {
  document.getElementById(id).style.display = 'none';
}

function fazerLogin() {
  esconderErro('loginErro');
  const email = document.getElementById('loginEmail').value.trim();
  const senha  = document.getElementById('loginSenha').value;
  if (!email || !senha) { mostrarErro('loginErro', 'Preencha e-mail e senha.'); return; }

  // Buscar usuário salvo
  const usuarios = JSON.parse(localStorage.getItem('om_usuarios') || '[]');
  const u = usuarios.find(u => u.email === email && u.senha === senha);
  if (!u) { mostrarErro('loginErro', 'E-mail ou senha incorretos.'); return; }

  setUsuario(u);
  window.location.href = 'app/dashboard.html';
}

function fazerCadastro() {
  esconderErro('cadErro');
  document.getElementById('cadOk').style.display = 'none';

  const nome        = document.getElementById('cadNome').value.trim();
  const email       = document.getElementById('cadEmail').value.trim();
  const marmoraria  = document.getElementById('cadMarmoraria').value.trim();
  const telefone    = document.getElementById('cadTelefone').value.trim();
  const senha       = document.getElementById('cadSenha').value;

  if (!nome)       { mostrarErro('cadErro', 'Informe seu nome.');            return; }
  if (!email)      { mostrarErro('cadErro', 'Informe um e-mail válido.');     return; }
  if (!marmoraria) { mostrarErro('cadErro', 'Informe o nome da marmoraria.'); return; }
  if (senha.length < 6) { mostrarErro('cadErro', 'Senha deve ter pelo menos 6 caracteres.'); return; }

  // Verificar duplicidade
  const usuarios = JSON.parse(localStorage.getItem('om_usuarios') || '[]');
  if (usuarios.find(u => u.email === email)) {
    mostrarErro('cadErro', 'Este e-mail já está cadastrado.');
    return;
  }

  const u = { id: gerarId(), nome, email, senha, nomeMarmoraria: marmoraria, telefone };
  usuarios.push(u);
  localStorage.setItem('om_usuarios', JSON.stringify(usuarios));

  // Configurar empresa inicial
  setEmpresa({
    nome: marmoraria,
    telefone,
    whatsapp: telefone,
    instagram: '',
    endereco: '',
    cnpj: '',
    logo: '',
    corPDF: 'verde',
    obsOrcamento: [
      'Medições definitivas serão realizadas após aprovação do orçamento.',
      'Variações naturais de cor e veios são características do material natural.',
      'Prazo de execução: a combinar após confirmação do pedido.',
      'Garantia de 12 meses contra defeitos de fabricação.',
      'Validade deste orçamento: {{validade}}.',
    ],
    msgWhats: 'Olá {{cliente}}, segue o orçamento Nº {{numero}} no valor de R$ {{valor}}. Qualquer dúvida estou à disposição!',
  });

  // Seed de demonstração
  seedDemo();

  setUsuario(u);

  // Redirecionar
  window.location.href = 'app/dashboard.html';
}

// Enter nos campos de login
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginSenha').addEventListener('keydown', e => {
    if (e.key === 'Enter') fazerLogin();
  });
  document.getElementById('cadSenha').addEventListener('keydown', e => {
    if (e.key === 'Enter') fazerCadastro();
  });
});
</script>
</body>
</html>
